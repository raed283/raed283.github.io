<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRFD Ground Queue Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .status-box {
            background-color: #00a8ff;
            color: #000;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        ol {
            padding-left: 20px;
        }
        li {
            padding: 6px;
            margin-bottom: 4px;
            background-color: #2a2a2a;
            border-radius: 4px;
        }
        li.active-user {
            background-color: #00a8ff;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>IRFD GND Monitor</h2>
        <div id="raed-status" class="status-box">Connecting to feed...</div>

        <h3>Active Holder</h3>
        <p id="ground-holder">Loading...</p>

        <h3>Current Queue</h3>
        <ol id="queue-list">
            <li>Loading queue...</li>
        </ol>
    </div>

    <script>
        // 1. FILL IN YOUR API URL HERE
        const API_URL = "https://24data.ptfs.app/controllers"; 
        
        const TARGET_USER = "Raed_64";
        const TARGET_AIRPORT = "IRFD";
        const TARGET_POSITION = "GND";

        let lastStatus = null; // Stores: 'holder', number (queue spot), or null

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop old speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function updateIRFDGround() {
            try {
                const response = await fetch(API_URL);
                const positions = await response.json();

                // Find specifically the IRFD GND object from the array
                const irfdGround = positions.find(pos => 
                    pos.airport === TARGET_AIRPORT && pos.position === TARGET_POSITION
                );

                const statusEl = document.getElementById("raed-status");
                const holderEl = document.getElementById("ground-holder");
                const queueListEl = document.getElementById("queue-list");

                if (!irfdGround) {
                    statusEl.textContent = "IRFD GND data not found in feed";
                    return;
                }

                // Render Holder
                holderEl.textContent = irfdGround.holder ? irfdGround.holder : (irfdGround.claimable ? "Available to claim" : "None");

                // Render Queue
                queueListEl.innerHTML = "";
                const queue = irfdGround.queue || [];

                if (queue.length === 0) {
                    queueListEl.innerHTML = "<li style='background:none; color:#888;'>Queue is empty</li>";
                } else {
                    queue.forEach((user) => {
                        const li = document.createElement("li");
                        li.textContent = user;
                        if (user === TARGET_USER) {
                            li.className = "active-user";
                        }
                        queueListEl.appendChild(li);
                    });
                }

                // Determine Raed_64's current status
                let currentStatus = null;

                if (irfdGround.holder === TARGET_USER) {
                    currentStatus = "holder";
                } else {
                    const index = queue.indexOf(TARGET_USER);
                    if (index !== -1) {
                        currentStatus = index + 1; // 1-based index (#1, #2, etc.)
                    }
                }

                // Update text status box
                if (currentStatus === "holder") {
                    statusEl.textContent = "Raed_64 is holding IRFD Ground!";
                } else if (typeof currentStatus === "number") {
                    statusEl.textContent = `Raed_64 is #${currentStatus} in queue for IRFD Ground`;
                } else {
                    statusEl.textContent = "Raed_64 is not in IRFD Ground queue";
                }

                // Text-To-Speech alert triggers on state change
                if (lastStatus !== null) {
                    if (lastStatus !== "holder" && currentStatus === "holder") {
                        speak("Raed 64 is now holding IRFD Ground");
                    } 
                    else if (typeof currentStatus === "number" && typeof lastStatus === "number") {
                        if (currentStatus < lastStatus) {
                            speak(`Raed 64 moved up to position ${currentStatus} for IRFD Ground`);
                        } else if (currentStatus > lastStatus) {
                            speak(`Raed 64 moved back to position ${currentStatus} for IRFD Ground`);
                        }
                    } 
                    else if (lastStatus !== null && currentStatus === null) {
                        speak("Raed 64 left the IRFD Ground queue");
                    } 
                    else if (lastStatus === null && currentStatus !== null) {
                        if (currentStatus === "holder") {
                            speak("Raed 64 is now holding IRFD Ground");
                        } else {
                            speak(`Raed 64 joined IRFD Ground queue at position ${currentStatus}`);
                        }
                    }
                }

                // Save status for next comparison cycle
                lastStatus = currentStatus;

            } catch (error) {
                console.error("Error fetching IRFD Ground data:", error);
            }
        }

        // Run immediately
        updateIRFDGround();

        // Refresh every 6 seconds
        setInterval(updateIRFDGround, 6000);
    </script>

</body>
</html>
