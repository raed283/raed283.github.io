<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRFD Ground Live Queue</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .holder-box {
            background-color: #2a2a2a;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid #00a8ff;
        }
        ol {
            padding-left: 20px;
        }
        li {
            padding: 8px;
            margin-bottom: 4px;
            background-color: #2a2a2a;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>IRFD Ground Monitor</h2>

        <div class="holder-box">
            <strong>Current Holder:</strong>
            <span id="ground-holder">Loading...</span>
        </div>

        <h3>Active Queue</h3>
        <ol id="queue-list">
            <li>Loading queue...</li>
        </ol>
    </div>

    <script>
        // REPLACE THIS WITH YOUR API URL
        const API_URL = "https://24data.ptfs.app/controllers"; 

        const TARGET_AIRPORT = "IRFD";
        const TARGET_POSITION = "GND";

        // Stores state from previous cycle to detect changes
        let previousHolder = null;
        let previousQueue = []; // Array of usernames from last fetch

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function updateIRFDGround() {
            try {
                const response = await fetch(API_URL);
                const positions = await response.json();

                // Find IRFD GND in the position[] array
                const irfdGround = positions.find(pos => 
                    pos.airport === TARGET_AIRPORT && pos.position === TARGET_POSITION
                );

                const holderEl = document.getElementById("ground-holder");
                const queueListEl = document.getElementById("queue-list");

                if (!irfdGround) {
                    holderEl.textContent = "Position data not found";
                    return;
                }

                const currentHolder = irfdGround.holder;
                const currentQueue = irfdGround.queue || [];

                // 1. Update UI - Holder
                holderEl.textContent = currentHolder ? currentHolder : (irfdGround.claimable ? "Available" : "None");

                // 2. Update UI - Queue
                queueListEl.innerHTML = "";
                if (currentQueue.length === 0) {
                    queueListEl.innerHTML = "<li style='background:none; color:#888;'>Queue is empty</li>";
                } else {
                    currentQueue.forEach((user) => {
                        const li = document.createElement("li");
                        li.textContent = user;
                        queueListEl.appendChild(li);
                    });
                }

                // 3. TTS Logic: Compare current fetch against previous fetch
                if (previousHolder !== null || previousQueue.length > 0) {

                    // Check if holder changed
                    if (currentHolder !== previousHolder) {
                        if (currentHolder) {
                            speak(`${currentHolder} is now holding IRFD Ground.`);
                        } else if (previousHolder) {
                            speak(`${previousHolder} is no longer holding IRFD Ground.`);
                        }
                    }

                    // Check for newly joined users
                    currentQueue.forEach((user, currentIndex) => {
                        const previousIndex = previousQueue.indexOf(user);

                        if (previousIndex === -1 && user !== currentHolder) {
                            speak(`${user} joined the queue at position ${currentIndex + 1}.`);
                        } else if (previousIndex > currentIndex) {
                            speak(`${user} moved up to position ${currentIndex + 1}.`);
                        }
                    });

                    // Check for users who left or were removed from the queue
                    previousQueue.forEach((user) => {
                        if (!currentQueue.includes(user) && user !== currentHolder) {
                            speak(`${user} left the queue.`);
                        }
                    });
                }

                // Save state for the next 6-second comparison
                previousHolder = currentHolder;
                previousQueue = [...currentQueue];

            } catch (error) {
                console.error("Error fetching IRFD Ground data:", error);
            }
        }

        // Run immediately on page load
        updateIRFDGround();

        // Refresh every 6 seconds
        setInterval(updateIRFDGround, 6000);
    </script>

</body>
</html>
