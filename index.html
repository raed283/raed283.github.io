<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRFD Ground Live Queue</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .holder-box {
            background-color: #2a2a2a;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid #00a8ff;
        }
        .status-line {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }
        ol {
            padding-left: 20px;
        }
        li {
            padding: 8px;
            margin-bottom: 4px;
            background-color: #2a2a2a;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>IRFD Ground Monitor</h2>
        <div class="status-line" id="status-line">Initializing...</div>

        <div class="holder-box">
            <strong>Current Holder:</strong>
            <span id="ground-holder">Loading...</span>
        </div>

        <h3>Active Queue</h3>
        <ol id="queue-list">
            <li>Loading queue...</li>
        </ol>
    </div>

    <script>
        const DIRECT_URL = "https://24data.ptfs.app/controllers";
        // corsproxy.io was unreliable here (silent hangs / returned HTML error pages
        // instead of JSON, which made response.json() throw and left the UI stuck
        // on "Loading..." forever since errors only went to console).
        // allorigins is generally more stable for this kind of read-only JSON proxying.
        const PROXY_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(DIRECT_URL);

        const TARGET_AIRPORT = "IRFD";
        const TARGET_POSITION = "GND";

        let previousHolder = null;
        let previousQueue = [];
        let consecutiveFailures = 0;

        function setStatus(msg) {
            document.getElementById("status-line").textContent = msg;
        }

        function setHolderText(msg, isError) {
            const holderEl = document.getElementById("ground-holder");
            holderEl.textContent = msg;
            holderEl.style.color = isError ? "#ff5555" : "#ffffff";
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function fetchWithTimeout(url, ms) {
            return Promise.race([
                fetch(url, { cache: "no-store" }),
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error("Request timed out")), ms)
                )
            ]);
        }

        async function getPositions() {
            // Try the proxy first, fall back to a direct fetch in case the
            // browser/environment doesn't actually need CORS-proxying
            // (e.g. server has since added CORS headers, or this is run
            // somewhere without browser CORS restrictions).
            const attempts = [PROXY_URL, DIRECT_URL];
            let lastError = null;

            for (const url of attempts) {
                try {
                    const response = await fetchWithTimeout(url, 8000);
                    if (!response.ok) {
                        lastError = new Error(`HTTP ${response.status} from ${url}`);
                        continue;
                    }
                    const text = await response.text();
                    // Guard against proxies returning an HTML error/interstitial
                    // page with a 200 status instead of real JSON.
                    let data;
                    try {
                        data = JSON.parse(text);
                    } catch (parseErr) {
                        lastError = new Error(`Non-JSON response from ${url}`);
                        continue;
                    }
                    if (!Array.isArray(data)) {
                        lastError = new Error(`Unexpected response shape from ${url}`);
                        continue;
                    }
                    return data;
                } catch (err) {
                    lastError = err;
                    continue;
                }
            }
            throw lastError || new Error("All fetch attempts failed");
        }

        async function updateIRFDGround() {
            try {
                const positions = await getPositions();

                const irfdGround = positions.find(pos =>
                    pos.airport === TARGET_AIRPORT && pos.position === TARGET_POSITION
                );

                const queueListEl = document.getElementById("queue-list");

                if (!irfdGround) {
                    setHolderText("Position data not found", true);
                    setStatus("Fetched OK but IRFD/GND missing from response — check TARGET_AIRPORT/TARGET_POSITION");
                    return;
                }

                const currentHolder = irfdGround.holder;
                const currentQueue = irfdGround.queue || [];

                setHolderText(currentHolder ? currentHolder : (irfdGround.claimable ? "Available" : "None"), false);
                setStatus("Last updated: " + new Date().toLocaleTimeString());
                consecutiveFailures = 0;

                queueListEl.innerHTML = "";
                if (currentQueue.length === 0) {
                    queueListEl.innerHTML = "<li style='background:none; color:#888;'>Queue is empty</li>";
                } else {
                    currentQueue.forEach((user) => {
                        const li = document.createElement("li");
                        li.textContent = user;
                        queueListEl.appendChild(li);
                    });
                }

                if (previousHolder !== null || previousQueue.length > 0) {
                    if (currentHolder !== previousHolder) {
                        if (currentHolder) {
                            speak(`${currentHolder} is now holding IRFD Ground.`);
                        } else if (previousHolder) {
                            speak(`${previousHolder} is no longer holding IRFD Ground.`);
                        }
                    }

                    currentQueue.forEach((user, currentIndex) => {
                        const previousIndex = previousQueue.indexOf(user);
                        if (previousIndex === -1 && user !== currentHolder) {
                            speak(`${user} joined the queue at position ${currentIndex + 1}.`);
                        } else if (previousIndex > currentIndex) {
                            speak(`${user} moved up to position ${currentIndex + 1}.`);
                        }
                    });

                    previousQueue.forEach((user) => {
                        if (!currentQueue.includes(user) && user !== currentHolder) {
                            speak(`${user} left the queue.`);
                        }
                    });
                }

                previousHolder = currentHolder;
                previousQueue = [...currentQueue];

            } catch (error) {
                consecutiveFailures++;
                const msg = (error && error.message) ? error.message : String(error);
                console.error("Error fetching IRFD Ground data: " + msg);
                setHolderText("Fetch failed", true);
                setStatus(`Error (${consecutiveFailures}x): ${msg}`);
            }
        }

        updateIRFDGround();
        setInterval(updateIRFDGround, 6000);
    </script>

</body>
</html>
